    <h1>夜班日志（沈屿笔迹 OCR）</h1>
    <blockquote>
      3月13日 夜<br>
      7号楼比别的楼冷。302周爷爷半夜起来，说有人站在床尾看他。<br>
      顾主任说：「别乱看，老人糊涂。」<br>
      但我在收发室看见慧忆的人又拉了一箱试剂。标签：<strong>M-027</strong>。<br>
      周德明爷爷的档案编号，也是 M-027。
    </blockquote></article>
