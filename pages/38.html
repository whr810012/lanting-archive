    <h1>顾临川自白（录音转写）</h1>
    <blockquote class="horror">
      沈屿导出的是周爷爷的记忆，还有许奶奶死后被复用的那部分。<br>
      我删监控，不是想害他。是江岳只有这么大，澜庭倒了，老人就没地方可去。<br>
      沈屿现在在哪？可能在 7-302。也可能——在磁带里。<br>
      搜索 <strong>烧档</strong> 看他开的条件，或 <strong>沈攸</strong> —— 先想清楚你要什么。
