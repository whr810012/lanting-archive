    <h1>照护记录：周德明</h1>
    <blockquote>
      三月十二日 阴<br>
      今晚又来了。不是我死去的爸。那个人站着不动。<br>
      护工小子后来脸色很差。他问我刚才说了什么。<br>
      我说不出口。嘴里有<strong>别的词</strong>。像文兰奶奶的声音。
    </blockquote></article>
