    <h1>澜庭档案：夜班失踪事件</h1>
    <p>沈屿已经失踪一周了。警察说「没有犯罪痕迹」，让我等。</p>
    <p>我等不了。</p>
    <p>我在他背包最底层翻到这个——一张澜庭老年公寓的临时工牌，和一张皱巴巴的纸条：</p>
    <blockquote><code>lanting-care.internal/archives</code></blockquote>
    <p>页面样式老旧，像十年前的政府网站。页脚写着：<strong>「请输入关键词检索档案。」</strong></p>
    <p>沈屿以前总说我「只会读不会找」。好。那我就找给他看。</p>
